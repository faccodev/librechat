version: 1.3.12

cache: true

interface:
  customWelcome: 'Bem vindo ao OlaxChat!'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true

registration:
  socialLogins: ['github', 'google', 'discord', 'openid', 'facebook', 'apple', 'saml']

# SSRF protection: default-deny for localhost/private IPs. Empty list =
# allow ALL domains. Acceptable for a single-tenant deployment (just you
# and your wife using it). If you ever want to lock it back down, replace
# `[]` with a list of explicit domains (one per line, e.g. `- 'google.com'`).
actions:
  allowedDomains: []

# MCP server domain restrictions. The defaults are NOT exposed to the
# browser / agent — only entries listed below are reachable from MCP tool
# calls. On Coolify the same internal Docker DNS resolves `mcp-browser`,
# `mcp-search`, etc., so these addresses work unchanged.
mcpSettings:
  allowedAddresses:
    - 'mcp-browser:8931'
    - 'mcp-search:8933'
    - 'mcp-transcribe:8934'
    - 'mcp-workspace:8932'
    - 'mcp-notion:3001'
    - 'mcp-meta-ads:8935'


# MCP servers. Same config as local — the URL is internal Docker DNS,
# which resolves identically on Coolify (same docker network namespace).
mcpServers:
  workspace:
    title: 'Workspace'
    # Native capability. Auto-injected into every agent run by
    # ToolService.loadAgentTools; hidden from the chat dropdown so users
    # don't toggle it manually; inspected at boot so tools are cached
    # before the first prompt.
    autoInject: true
    chatMenu: false
    startup: true
    type: streamable-http
    url: 'http://mcp-workspace:8932/sse'
    timeout: 120000
    initTimeout: 30000
  browser:
    title: 'Navegador'
    iconPath: '/assets/mcp/browser.png'
    # Native capability. Same auto-inject story as workspace — see the
    # header comment above.
    autoInject: true
    chatMenu: false
    startup: true
    type: streamable-http
    url: 'http://mcp-browser:8931/mcp'
    timeout: 300000
    initTimeout: 30000
  search:
    title: 'Pesquisa Google'
    iconPath: '/assets/mcp/search.png'
    # Native capability. Same auto-inject story as workspace — see the
    # header comment above.
    autoInject: true
    chatMenu: false
    startup: true
    type: streamable-http
    url: 'http://mcp-search:8933/mcp'
    timeout: 60000
    initTimeout: 30000
  transcribe:
    title: 'Transcrever'
    iconPath: '/assets/mcp/transcribe.png'
    type: streamable-http
    url: 'http://mcp-transcribe:8934/mcp'
    timeout: 300000
    initTimeout: 60000
    startup: false
  higgsfield:
    title: 'Higgsfield'
    iconPath: '/assets/mcp/higgsfield.png'
    type: streamable-http
    url: 'https://mcp.higgsfield.ai/mcp'
    timeout: 30000
    startup: false
  fb-marketing:
    title: 'Meta ADS'
    iconPath: '/assets/mcp/meta.png'
    type: streamable-http
    url: 'http://mcp-meta-ads:8935/mcp'
    timeout: 30000
    initTimeout: 60000
    startup: false
  notion:
    title: 'Notion'
    iconPath: '/assets/mcp/notion.png'
    type: streamable-http
    url: 'http://mcp-notion:3001/mcp'
    timeout: 30000
    startup: false
  github:
    title: 'GitHub'
    iconPath: '/assets/mcp/github.png'
    type: stdio
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-github'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: '${GITHUB_PERSONAL_ACCESS_TOKEN}'
    timeout: 60000
    startup: false
  fetch:
    title: 'Busca Leve'
    iconPath: '/assets/mcp/fetch.png'
    # Native capability. Auto-injected into every agent run; hidden from
    # the chat dropdown so users don't toggle it manually. Note: this is
    # a stdio server (spawns `uvx mcp-server-fetch` per request) so the
    # api needs uv/uvx in the container image for the spawn to succeed.
    # If you're deploying without uvx, drop the autoInject / chatMenu /
    # startup lines below and the server will fall back to lazy spawn.
    autoInject: true
    chatMenu: false
    startup: true
    type: stdio
    command: uvx
    args:
      - mcp-server-fetch
    timeout: 30000

# ----------------------------------------------------------------------------
# Built-in endpoints — INTENTIONALLY EMPTY in the Coolify config.
#
# On local dev you might have OPENAI_API_KEY / GOOGLE_KEY / ANTHROPIC_KEY in
# .env from older testing. On the VPS we want ONLY OmniRoute exposed in the
# model selector. Built-in sections (openAI / google / anthropic) default to
# "not configured" when their keys are empty, so the simplest path is to just
# not include them at all. If you ever want a direct provider fallback, copy
# the block back from librechat.yaml.
# ----------------------------------------------------------------------------

endpoints:
  custom:
    # OmniRoute — single AI gateway. 231 providers (50+ free) fronted by one
    # OpenAI-compatible endpoint on the Docker network. Auto-fallback across
    # providers, auto-quota tracking, token compression.
    - name: 'omniroute'
      apiKey: '${OMNIROUTE_API_KEY}'
      baseURL: 'http://omniroute:20128/v1'
      customParams:
        defaultParamsEndpoint: 'openAI'
      models:
        default: ['auto']
        fetch: true
      modelDisplayLabel: 'OmniRoute'
      iconURL: 'https://img.icons8.com/fluent/1200/ai-agent.jpg'
      titleConvo: true
      titleModel: 'auto'
      # On Coolify you may want to forward per-user identity to OmniRoute
      # for per-user rate-limit + audit. Requires OmniRoute >= v3.7 with
      # header-based identity forwarding enabled in its dashboard.
      # headers:
      #   X-User-Id: '{{LIBRECHAT_USER_ID}}'
      #   X-User-Email: '{{LIBRECHAT_USER_EMAIL}}'

# Per-user workspace via MCP filesystem server. containerBasePath is the
# INSIDE-container path that the filesystem MCP exposes; the bind mount at
# /home/workspaces (host) → /workspaces (container) is configured in
# docker-compose.yml's api service. If your Coolify deployment uses a
# different host path (e.g. /data/workspaces), update docker-compose.yml's
# bind mount AND the rclone service's WORKSPACES_HOST_PATH.
workspaces:
  enabled: true
  containerBasePath: '/workspaces'
  sizeLimitMB: 2048


speech:
  stt:
    fasterWhisper:
      url: 'http://mcp-faster-whisper:9000/asr'
      language: 'pt'
      task: 'transcribe'
      vad_filter: true
      word_timestamps: false