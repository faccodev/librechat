version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librechat-api
    # Porta 3080 exposta no host. Forma simples (shorthand) — algumas versões
    # do Coolify ignoram a forma longa (target/published/mode).
    ports:
      - "3080:3080"
    # Labels completas pro Coolify v4. Sem `coolify.application` e `coolify.service`
    # o parser mostra a seção "Domains for api" mas não popula a porta-alvo no
    # formulário de domínio — fica cinza/vazio e o usuário não consegue anexar FQDN.
    labels:
      - "coolify.managed=true"
      - "coolify.application=librechat"
      - "coolify.service=api"
      - "coolify.port=3080"
      - "coolify.type=application"
      - "coolify.healthcheck.path=/livez"
      - "coolify.healthcheck.port=3080"
      - "traefik.enable=true"
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    # Healthcheck via `node` (sempre presente no PATH da imagem `node:alpine`),
    # apontando pra 127.0.0.1 — mais confiável que `wget` do busybox que tem
    # flags limitados e pode falhar silenciosamente, deixando o serviço marcado
    # como unhealthy e escondendo o painel de domínio em algumas versões.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:3080/livez', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      # O Coolify permite preencher essas variáveis pelo painel de variáveis de ambiente
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-super_secret_meili_master_key_change_me}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_me_at_least_32_chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_change_me}
      # Caminhos para uploads
      - UPLOADS_DIR=/app/uploads
      # --- COOKIE SECURE OVERRIDE ---
      # Enquanto o acesso for via HTTP (ex.: http://IP:3080), o browser recusa
      # enviar cookies com flag Secure → F5 desloga o usuário. Forçando false
      # aqui, shouldUseSecureCookie() em packages/api/src/oauth/csrf.ts retorna
      # false e os cookies (refreshToken, token_provider) saem sem a flag.
      # TROQUE PARA true (ou remova esta linha) assim que o domínio HTTPS do
      # Coolify estiver ativo — cookies sem Secure sobre HTTPS são sniffáveis.
      - SESSION_COOKIE_SECURE=false
    volumes:
      # Arquivo de configuração customizado do LibreChat
      - ./librechat.yaml:/app/librechat.yaml
      # Uploads persistentes
      - librechat_uploads:/app/uploads
      # --- FUNCIONALIDADE DE WORKSPACES ---
      # Mapeia a pasta do host no VPS para dentro do container.
      # Mude "/home/workspaces" se preferir usar outro caminho no host do VPS.
      - /home/workspaces:/workspaces
    networks:
      - librechat-network

  mongodb:
    image: mongo:6.0
    container_name: librechat-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - librechat-network

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: librechat-meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-super_secret_meili_master_key_change_me}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - librechat-network

volumes:
  mongodb_data:
  meili_data:
  librechat_uploads:

networks:
  librechat-network:
    name: librechat-network
