# ==============================================================================
# LibreChat — Single Docker Compose (cross-platform: Linux VPS + Windows local)
# ==============================================================================
# Run with:  docker compose up -d
#
# Cross-platform env vars (set in .env or Coolify panel):
#   WORKSPACES_HOST_PATH  Absolute or relative path on the host for the
#                         /workspaces bind mount. Linux VPS: /home/workspaces.
#                         Windows local: ./workspaces (resolved relative to
#                         this file).
#
#   HOST_WORKSPACES_BASE  Path that mcp-code-runner passes to child containers
#                         when they need to write back. Must match the host's
#                         view of WORKSPACES_HOST_PATH. Linux: /home/workspaces.
#                         Windows: e:/Github/librechat/workspaces (or wherever
#                         your checkout lives — full path with forward slashes
#                         works inside Docker Desktop's VM).
#
#   UID / GID             Linux-only. Used to chown the api container so bind
#                         mounts don't end up owned by root. Windows ignores
#                         these (Docker Desktop runs as the host user).
#
#   EXTRA_HOSTS           Set to "true" on Linux if any service needs to reach
#                         the host machine (e.g. local Ollama at
#                         host.docker.internal:11434). Default is "true" so
#                         the existing librechat.yaml entries work as-is.
#                         Windows always has host.docker.internal built in.
#
# Architecture decisions (read these before changing the file):
#   * No `container_name` on any service. Coolify generates names; on local
#     Docker, Compose generates names. Both want auto-naming to avoid clashes
#     with the host's existing containers.
#   * No `networks:` section. The default `librechat_default` network is what
#     Coolify expects. Hardcoding a custom network breaks Coolify's Traefik
#     routing silently.
#   * The api container is built locally from ./Dockerfile (not pulled from
#     registry.librechat.ai) so the in-progress workspace feature ships with
#     the working tree.
#   * mcp-code-runner mounts /var/run/docker.sock. On Linux that means the
#     child containers run as root on the host. Acceptable for single-tenant
#     deployments; not safe on shared hosts.
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: node
      args:
        - NPM_CI_TIMEOUT_SECONDS=1500
        - NPM_CI_ATTEMPTS=2
    restart: always
    ports:
      - "3080:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pass the host .env into the api container. The LibreChat api
    # reads dozens of env vars (ALLOW_REGISTRATION, OPENAI_API_KEY,
    # GOOGLE_KEY, etc.) — listing them all in `environment:` below
    # is fragile. `env_file` merges .env into process.env before
    # the entrypoint runs, and vars explicitly listed in
    # `environment:` (like MEILI_MASTER_KEY below) win on conflict.
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/livez || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - UPLOADS_DIR=/app/uploads
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - librechat_uploads:/app/uploads
      - ${WORKSPACES_HOST_PATH}:/workspaces
    # Coolify labels: only `coolify.managed` and `coolify.type` are official.
    # Coolify auto-applies the applicationId. Adding unofficial labels can
    # confuse its parser.
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"

  mongodb:
    image: mongo:8.0.20
    restart: always
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27017 --eval 'db.adminCommand({ ping: 1 })' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # ---------------------------------------------------------------------------
  # Browser MCP — @agent-infra/mcp-server-browser (ByteDance UI-TARS).
  # Token-efficient alternative to Playwright MCP. Uses Puppeteer + structured
  # accessibility tree (~80-90% smaller payloads than Playwright MCP's raw
  # DOM dump). Exposes streamable-http natively on port 8931, matching the
  # exact URL shape the old mcp-playwright used — so librechat.yaml can swap
  # hostnames with zero structural change.
  #
  # Image source: ghcr.io/bytedance/agent-infra-mcp-server-browser (official).
  # --no-sandbox is required when running Chromium as the container's init PID.
  # --user-data-dir + browser_profile volume persist cookies/localStorage
  # between restarts (same role as playwright_profile did).
  #
  # Replaces the old mcp-playwright service (Microsoft Playwright MCP), which
  # was crashing the host with a stubborn entrypoint permission issue on
  # Linux VPS (see git history — .docker/playwright-entrypoint.sh arrived
  # root-owned and the node user couldn't exec it). Removing it eliminates
  # the crash loop.
  # ---------------------------------------------------------------------------
  mcp-browser:
    image: ghcr.io/bytedance/agent-infra-mcp-server-browser:latest
    restart: always
    init: true
    # Chromium crashes with Docker's default 64MB /dev/shm. 2GB matches the
    # upstream recommendation in the @agent-infra docs.
    shm_size: '2gb'
    command:
      - --transport=http
      - --host=0.0.0.0
      - --port=8931
      - --headless
      - --no-sandbox
      - --user-data-dir=/ms-browser
      - --output-dir=/ms-browser/output
    volumes:
      - browser_profile:/ms-browser

  # ---------------------------------------------------------------------------
  # mcp-code-runner — code execution MCP. Mounts the Docker socket so it can
  # spin up ephemeral containers to run untrusted code with resource limits.
  # ---------------------------------------------------------------------------
  mcp-code-runner:
    build:
      context: ./packages/mcp-code-runner
      dockerfile: Dockerfile
    restart: always
    init: true
    volumes:
      - ${WORKSPACES_HOST_PATH}:/workspaces
      # Linux and Windows (Docker Desktop) both expose /var/run/docker.sock
      # inside the container. On Windows the path is the WSL2 VM's docker
      # socket, which is what we want.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WORKSPACES_BASE=/workspaces
      - HOST_WORKSPACES_BASE=${HOST_WORKSPACES_BASE}
      - MAX_TIMEOUT=120
      - RUNNER_MEMORY=${RUNNER_MEMORY:-512m}
      - RUNNER_CPUS=${RUNNER_CPUS:-1.0}

  # ---------------------------------------------------------------------------
  # Notion MCP — persistent container, http transport on port 3001.
  # NOTION_TOKEN must be set in the host env (.env or Coolify panel).
  # ---------------------------------------------------------------------------
  mcp-notion:
    image: node:20-alpine
    restart: always
    command:
      - npx
      - -y
      - "@notionhq/notion-mcp-server"
      - --transport
      - http
      - --port
      - "3001"
      - --disable-auth
    environment:
      - NOTION_TOKEN=${NOTION_TOKEN:-}

  # ---------------------------------------------------------------------------
  # faster-whisper — self-hosted STT. Exposes POST /asr on port 9000 (image
  # default). LibreChat hits http://mcp-faster-whisper:9000/asr per
  # speech.stt.fasterWhisper.url in librechat.yaml.
  # ---------------------------------------------------------------------------
  mcp-faster-whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: always
    init: true
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=small
      - ASR_QUANTIZATION=int8
    volumes:
      - faster_whisper_cache:/data/whisper

volumes:
  mongodb_data:
  meili_data:
  librechat_uploads:
  faster_whisper_cache:
  browser_profile:
