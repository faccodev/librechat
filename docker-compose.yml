# ==============================================================================
# LibreChat — Single Docker Compose (cross-platform: Linux VPS + Windows local)
# ==============================================================================
# Run with:  docker compose up -d
#
# Cross-platform env vars (set in .env or Coolify panel):
#   WORKSPACES_HOST_PATH  Absolute or relative path on the host for the
#                         /workspaces bind mount. Linux VPS: /home/workspaces.
#                         Windows local: ./workspaces (resolved relative to
#                         this file).
#
#   HOST_WORKSPACES_BASE  Path that mcp-code-runner passes to child containers
#                         when they need to write back. Must match the host's
#                         view of WORKSPACES_HOST_PATH. Linux: /home/workspaces.
#                         Windows: e:/Github/librechat/workspaces (or wherever
#                         your checkout lives — full path with forward slashes
#                         works inside Docker Desktop's VM).
#
#   UID / GID             Linux-only. Used to chown the api container so bind
#                         mounts don't end up owned by root. Windows ignores
#                         these (Docker Desktop runs as the host user).
#
#   EXTRA_HOSTS           Set to "true" on Linux if any service needs to reach
#                         the host machine (e.g. local Ollama at
#                         host.docker.internal:11434). Default is "true" so
#                         the existing librechat.yaml entries work as-is.
#                         Windows always has host.docker.internal built in.
#
# Architecture decisions (read these before changing the file):
#   * No `container_name` on any service. Coolify generates names; on local
#     Docker, Compose generates names. Both want auto-naming to avoid clashes
#     with the host's existing containers.
#   * No `networks:` section. The default `librechat_default` network is what
#     Coolify expects. Hardcoding a custom network breaks Coolify's Traefik
#     routing silently.
#   * The api container is built locally from ./Dockerfile (not pulled from
#     registry.librechat.ai) so the in-progress workspace feature ships with
#     the working tree.
#   * mcp-code-runner mounts /var/run/docker.sock. On Linux that means the
#     child containers run as root on the host. Acceptable for single-tenant
#     deployments; not safe on shared hosts.
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # config-validator — gate service. Runs validate-config.mjs against the
  # mounted YAML before the api tries to boot. If validation fails, the
  # container exits non-zero and `api`'s `depends_on: condition: service_completed_successfully`
  # blocks the api from starting. The user sees a clear error in Coolify's
  # deployment log instead of an infinite api restart loop. This was added
  # after multiple incidents where a single YAML typo (e.g. `key:[]` instead
  # of `key: []`) took the entire api offline.
  #
  # Not gated by `profiles:` because docker compose refuses `depends_on` on
  # a service that's behind a profile that isn't active at build time —
  # see commit "fix: don't gate config-validator behind a profile".
  # ---------------------------------------------------------------------------
  config-validator:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./librechat_coolify.yaml:/app/librechat_coolify.yaml:ro
      - ./packages/data-provider:/app/packages/data-provider:ro
    environment:
      - CONFIG_PATH=${CONFIG_PATH:-/app/librechat_coolify.yaml}
      - NODE_PATH=/app/packages/data-provider/node_modules
    command: ["sh", "-c", "npm install --no-save --no-audit --no-fund --silent js-yaml@4 && node scripts/validate-config.mjs"]
    # No healthcheck — this is a one-shot job, not a server.

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: node
      args:
        - NPM_CI_TIMEOUT_SECONDS=1500
        - NPM_CI_ATTEMPTS=2
    restart: always
    ports:
      - "3080:3080"
    # `host.docker.internal:host-gateway` is needed ONLY on Windows + Docker
    # Desktop (where the host's loopback is not reachable from inside the
    # container by default). On Linux VPS / Coolify, the host network is
    # already accessible — keep this commented out there or Docker logs
    # noise about a non-resolvable host. Toggle by uncommenting if you
    # run on Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pass the host .env into the api container. The LibreChat api
    # reads dozens of env vars (ALLOW_REGISTRATION, OPENAI_API_KEY,
    # GOOGLE_KEY, etc.) — listing them all in `environment:` below
    # is fragile. `env_file` merges .env into process.env before
    # the entrypoint runs, and vars explicitly listed in
    # `environment:` (like MEILI_MASTER_KEY below) win on conflict.
    env_file:
      - .env
    depends_on:
      config-validator:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/livez || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - UPLOADS_DIR=/app/uploads
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - WORKSPACE_ROOTS=${WORKSPACE_ROOTS:-/workspaces}
      # CONFIG_PATH tells the api which librechat*.yaml to load.
      # Default: /app/librechat.yaml (the local-dev one).
      # On Coolify, set in .env: CONFIG_PATH=/app/librechat_coolify.yaml
      # — the coolify-specific config is mounted alongside at the same path.
      - CONFIG_PATH=${CONFIG_PATH:-/app/librechat.yaml}
    volumes:
      # Both yaml files are mounted; CONFIG_PATH picks which one the api reads.
      # Local dev → CONFIG_PATH defaults to /app/librechat.yaml.
      # Coolify   → set CONFIG_PATH=/app/librechat_coolify.yaml in .env.
      - ./librechat.yaml:/app/librechat.yaml
      - ./librechat_coolify.yaml:/app/librechat_coolify.yaml
      - librechat_uploads:/app/uploads
      # Image uploads (user avatars, agent avatars, assistant avatars,
      # message attachments) land in `client/public/images/<userId>/`
      # via `api/server/services/Files/Local/images.js`. Without a
      # persistent volume, every redeploy wipes the directory and
      # avatar URLs return 404. Bind-mount the named volume
      # `librechat_images` at the same path the app writes to.
      - librechat_images:/app/client/public/images
      # WORKSPACES_HOST_PATH must be an ABSOLUTE host path (e.g. /home/workspaces
      # on a Linux VPS) for the bind mount to work. Without the explicit
      # `:-/home/workspaces` fallback, an unset variable becomes the empty
      # string and Docker silently creates a NAMED VOLUME called `""` — which
      # is exactly the trap Coolify's "use a volume" preset triggers. Setting
      # a default here also means a fresh `docker compose up` on a Linux box
      # Just Works without the operator having to remember to edit the .env.
      - /home/workspaces:/workspaces
    # Coolify labels: only `coolify.managed` and `coolify.type` are official.
    # Coolify auto-applies the applicationId. Adding unofficial labels can
    # confuse its parser.
    labels:
      - "coolify.managed=true"
      - "coolify.type=application"

  mongodb:
    image: mongo:8.0.20
    restart: always
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host 127.0.0.1 --port 27017 --eval 'db.adminCommand({ ping: 1 })' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # ---------------------------------------------------------------------------
  # Browser MCP — @agent-infra/mcp-server-browser (ByteDance UI-TARS).
  # Token-efficient alternative to Playwright MCP. Uses Puppeteer + structured
  # accessibility tree (~80-90% smaller payloads than Playwright MCP's raw
  # DOM dump). Exposes streamable-http + SSE on port 8931 (same port the old
  # mcp-playwright used → zero structural change in librechat.yaml).
  #
  # No official pre-built image is published yet (upstream Dockerfile.http
  # notes "image will be published together"). We build from
  # ./.docker/mcp-browser.Dockerfile — a slimmed-down fork of the upstream
  # Dockerfile.http, plus a small entrypoint wrapper
  # (.docker/mcp-browser-entrypoint.sh) that chowns the browser_profile
  # volume to pptruser at startup. Without the chown, Chrome fails to
  # create SingletonLock inside the mounted volume (root-owned by default
  # in named volumes) and every browser launch aborts.
  # ---------------------------------------------------------------------------
  mcp-browser:
    build:
      context: .
      dockerfile: .docker/mcp-browser.Dockerfile
    restart: always
    init: true
    # Chromium crashes with Docker's default 64MB /dev/shm. 2GB matches the
    # upstream recommendation in the @agent-infra docs.
    shm_size: '2gb'
    # The Dockerfile installs `mcp-server-browser` globally via `npm i -g`
    # and the entrypoint wrapper just `exec "$@"`. So `command:` passes
    # the binary + flags directly. The container runs as root because
    # Chrome's --no-sandbox flag is auto-applied by the upstream server
    # when it detects a container environment, and dropping to pptruser
    # would need CAP_SETUID which isn't granted.
    command:
      - mcp-server-browser
      - --host=0.0.0.0
      - --port=8931
      - --headless
      - --user-data-dir=/ms-browser
      - --output-dir=/ms-browser/output
    volumes:
      - browser_profile:/ms-browser
      # Mount workspaces so browser-based fetches of local files (e.g. an
      # agent navigating to file:///workspaces/report.html) work. The browser
      # sandbox otherwise can't see the host's workspace files.
      - /home/workspaces:/workspaces

  # ---------------------------------------------------------------------------
  # Web search MCP — DuckDuckGo via nickclyde/duckduckgo-mcp-server.
  # Free, no API key, with built-in rate limiting (30 search req/min,
  # 20 fetch req/min). Uses DuckDuckGo's HTML endpoint via httpx by default;
  # `[browser]` extra adds curl_cffi for TLS fingerprint impersonation on
  # sites that block the default backend.
  #
  # Exposed via streamable-http so it matches the same shape the other MCP
  # services use (browser, notion, code-runner). Tools exposed: `search`
  # (returns formatted results w/ titles, URLs, snippets) and
  # `fetch_content` (fetches + parses arbitrary URL text).
  #
  # Image: python:3.12-slim + uv (so we can `uvx` the package on demand).
  # uv caches wheels in /uv-cache so the build is fast on restarts.
  #
  # Wrapper note: the upstream CLI doesn't expose a way to disable FastMCP's
  # DNS rebinding protection, which rejects requests with
  # ``Host: mcp-search:8933`` (not 127.0.0.1 / localhost) with HTTP 421.
  # The launcher is embedded inline in this command (base64-decoded at
  # startup) so the file lives *inside* the uvx venv, avoiding bind-mount
  # visibility issues that surfaced when running on Coolify / VPS storage
  # drivers that hide host bind mounts from uvx's isolated venv.
  # ---------------------------------------------------------------------------
  mcp-search:
    image: python:3.12-slim
    restart: always
    init: true
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir uv && \
        cat > /tmp/launcher.py <<'LAUNCHER_EOF'
        """Launcher: disable FastMCP DNS rebinding protection for Docker-internal traffic.

        Default ``enable_dns_rebinding_protection=True`` rejects ``Host: mcp-search:8933``
        with 421 Misdirected Request. We set it to False so the middleware short-circuits
        the host/origin validation. Widening ``allowed_hosts`` is *not* enough — the
        validator only matches exact entries or ``host:*`` port-suffix patterns, not a
        bare ``"*"``. Safe because the listener only sees the internal Docker network.
        """
        import sys
        import duckduckgo_mcp_server.server as srv
        try:
            from mcp.server.transport_security import TransportSecuritySettings
        except ImportError:
            from mcp.server.fastmcp import TransportSecuritySettings
        srv.mcp.settings.transport_security = TransportSecuritySettings(
            allowed_hosts=["*"],
            allowed_origins=["*"],
            enable_dns_rebinding_protection=False,
        )
        sys.exit(srv.main())
        LAUNCHER_EOF
        exec uvx --from "duckduckgo-mcp-server[browser]" \
            --with "duckduckgo-mcp-server[browser]" \
            python /tmp/launcher.py \
            --transport streamable-http \
            --host 0.0.0.0 \
            --port 8933
    environment:
      - DDG_SAFE_SEARCH=MODERATE
      - DDG_REGION=wt-wt
    volumes:
      - search_uv_cache:/uv-cache
      # Mount the workspaces directory so search/fetch_content tools that get
      # passed a /workspaces/... path can read the file directly. Without this
      # the container's /workspaces is empty and any local-file fetch fails.
      - /home/workspaces:/workspaces

  # ---------------------------------------------------------------------------
  # mcp-code-runner — code execution MCP. Mounts the Docker socket so it can
  # spin up ephemeral containers to run untrusted code with resource limits.
  # ---------------------------------------------------------------------------
  mcp-code-runner:
    build:
      context: ./packages/mcp-code-runner
      dockerfile: Dockerfile
    restart: always
    init: true
    volumes:
      - /home/workspaces:/workspaces
      # Linux and Windows (Docker Desktop) both expose /var/run/docker.sock
      # inside the container. On Windows the path is the WSL2 VM's docker
      # socket, which is what we want.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WORKSPACES_BASE=/workspaces
      # HOST_WORKSPACES_BASE is the path that the mcp-code-runner tells its
      # child executor containers to mount. Must be the SAME absolute path
      # the host sees for WORKSPACES_HOST_PATH — the executor container runs
      # via the host's docker daemon, so the path has to be host-relative,
      # not container-relative. Default mirrors the WORKSPACES_HOST_PATH
      # fallback for the same reason.
      - HOST_WORKSPACES_BASE=${HOST_WORKSPACES_BASE:-/home/workspaces}
      - MAX_TIMEOUT=120
      - RUNNER_MEMORY=${RUNNER_MEMORY:-512m}
      - RUNNER_CPUS=${RUNNER_CPUS:-1.0}
      # Pin PORT to 8932 — do NOT inherit PORT=3080 from .env (that's the
      # API's port). mcp-code-runner's default is 8932, but it falls back
      # to process.env.PORT if set, which would conflict with the API.
      - PORT=8932
      - WORKSPACE_ROOTS=${WORKSPACE_ROOTS:-/workspaces}
      - RUNNER_PROJECT_CONTEXT_HEADER=${RUNNER_PROJECT_CONTEXT_HEADER:-X-Project-Context}
      # Per-language executor images. Defaults are built locally by
      # scripts/pull-images.sh from ./executors/Dockerfile.* (each one
      # extends the upstream base image with `git` pre-installed so
      # `run_code` can `git clone` without paying the install cost
      # on every call). Override any of these to plug in your own
      # image with extra tools (jq, curl, ffmpeg, etc.) baked in.
      # Set to empty string to opt out of the override and use the
      # local default.
      - RUNNER_IMAGE_DEFAULT=${RUNNER_IMAGE_DEFAULT:-mcp-runner-alpine:latest}
      - RUNNER_IMAGE_NODE=${RUNNER_IMAGE_NODE:-mcp-runner-node:latest}
      - RUNNER_IMAGE_PYTHON=${RUNNER_IMAGE_PYTHON:-mcp-runner-python:latest}

  # ---------------------------------------------------------------------------
  # Notion MCP — persistent container, http transport on port 3001.
  # NOTION_TOKEN must be set in the host env (.env or Coolify panel).
  # ---------------------------------------------------------------------------
  mcp-notion:
    image: node:20-alpine
    restart: always
    command:
      - npx
      - -y
      - "@notionhq/notion-mcp-server"
      - --transport
      - http
      - --port
      - "3001"
      - --disable-auth
    environment:
      - NOTION_TOKEN=${NOTION_TOKEN:-}

  # ---------------------------------------------------------------------------
  # faster-whisper — self-hosted STT. Exposes POST /asr on port 9000 (image
  # default). LibreChat hits http://mcp-faster-whisper:9000/asr per
  # speech.stt.fasterWhisper.url in librechat.yaml. Also consumed by the
  # mcp-transcribe wrapper (below) which exposes the same model as MCP tools
  # so agents can transcribe on demand.
  # ---------------------------------------------------------------------------
  mcp-faster-whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: always
    init: true
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=small
      - ASR_QUANTIZATION=int8
    volumes:
      - faster_whisper_cache:/data/whisper

  # ---------------------------------------------------------------------------
  # mcp-transcribe — MCP server wrapper around mcp-faster-whisper. Exposes
  # three tools to LibreChat agents:
  #   * transcribe_file(path, language?) — transcribe a local audio/video file
  #   * transcribe_url(url, language?)   — download URL then transcribe
  #   * list_models()                     — show loaded faster-whisper model
  # Streamable-http on port 8934. Built from ./mcp-transcribe/Dockerfile.
  # ---------------------------------------------------------------------------
  mcp-transcribe:
    build:
      context: ./packages/mcp-transcribe
    restart: always
    init: true
    environment:
      - FASTER_WHISPER_URL=http://mcp-faster-whisper:9000
      - FASTER_WHISPER_LANGUAGE=pt
    depends_on:
      - mcp-faster-whisper
    # Mount the same workspaces directory the api + mcp-code-runner see,
    # so transcribe_file(path="/workspaces/...") resolves to the same
    # host-backed files the FileManager panel shows. Without this, the
    # container's /workspaces is empty and any attempt to read a workspace
    # file fails with FileNotFoundError.
    volumes:
      - /home/workspaces:/workspaces
    ports:
      - "8934:8934"

  # ---------------------------------------------------------------------------
  # fb-marketing-mcp — self-hosted Meta Ads MCP. Replaces the old remote
  # https://mcp.facebook.com/ads (which used hardcoded OAuth credentials
  # in librechat.yaml). yvfl/faceads-mcp: 30+ tools (campaigns, adsets,
  # ads, insights, audiences, custom API calls) and 713 docs bundled.
  # Single-tenant auth via META_ACCESS_TOKEN (set in host .env). Multi-
  # tenant OAuth is supported upstream but disabled here until a public
  # callback URL is needed. Streamable-http on port 8935 (matches the
  # 8931-8934 convention of the other MCP services in this compose).
  # ---------------------------------------------------------------------------
  fb-marketing-mcp-postgres:
    image: postgres:16-alpine
    restart: always
    init: true
    environment:
      - POSTGRES_USER=mcp
      - POSTGRES_PASSWORD=${FB_MARKETING_MCP_DB_PASSWORD:-mcp_dev_2026}
      - POSTGRES_DB=fb_marketing_mcp
    volumes:
      - fb_marketing_mcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d fb_marketing_mcp"]
      interval: 5s
      timeout: 3s
      retries: 5

  fb-marketing-mcp:
    build:
      context: ./packages/fb-marketing-mcp
    restart: always
    init: true
    env_file:
      - .env
    depends_on:
      fb-marketing-mcp-postgres:
        condition: service_healthy
    environment:
      # Pin PORT to 8935 — do NOT inherit PORT=3080 from .env (that's the
      # API's port). The MCP defaults to 3000; 8935 follows our convention.
      - PORT=8935
      - DATABASE_URL=postgresql://mcp:${FB_MARKETING_MCP_DB_PASSWORD:-mcp_dev_2026}@fb-marketing-mcp-postgres:5432/fb_marketing_mcp
      - MCP_ENCRYPTION_KEY=${MCP_ENCRYPTION_KEY}
      # META_ACCESS_TOKEN is loaded from .env via env_file above. Don't
      # duplicate it here. MCP_BASE_URL is intentionally omitted — it is
      # only required for OAuth callbacks, which we are not using.
    healthcheck:
      # Use 127.0.0.1, not localhost: on Alpine `getent hosts localhost` returns
      # ::1 (IPv6) but the upstream server only binds to 0.0.0.0 (IPv4), so
      # `localhost` resolves to a closed port and the check always fails.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8935/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Override Dockerfile's 15s start_period — Prisma migrate deploy +
      # client generate on first run can take 30-60s.
      start_period: 60s

# ---------------------------------------------------------------------------
  # OmniRoute — optional AI gateway (diegosouzapw/omniroute).
  #
  # Sits in front of 231 providers (50+ free) and exposes an OpenAI-compatible
  # /v1 endpoint on port 20128. When ENABLE_OMNIROUTE=false, this whole block
  # is skipped by `docker compose up`. The container's `api` does NOT depend
  # on this service — disabling OmniRoute must NOT break LibreChat's startup.
  #
  # Custom endpoint wiring lives in librechat.yaml (endpoints.custom.omniroute).
  # When ENABLE_OMNIROUTE=false, the provider is still declared in librechat.yaml
  # but model fetch fails silently (the endpoint's API key check is what hides it).
  #
  # Uses the `base` image (smallest). Switch to `web` profile upstream if you
  # need web-cookie providers (gemini-web, claude-web) — that requires the
  # upstream `web` target which we don't build here.
  # ---------------------------------------------------------------------------
  omniroute-redis:
    image: redis:7-alpine
    restart: always
    init: true
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - omniroute_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: diegosouzapw/omniroute:latest
    restart: always
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OMNIROUTE_DASHBOARD_PORT:-20128}:20128"
      - "${OMNIROUTE_API_PORT:-20129}:20129"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - REDIS_URL=redis://omniroute-redis:6379
    volumes:
      - omniroute_data:/app/data
    depends_on:
      omniroute-redis:
        condition: service_healthy
    healthcheck:
      # OmniRoute ships its own Node healthcheck script — there's no public
      # /healthz route (the dashboard returns the SPA shell, not 200). Using
      # the bundled script is what the official docker-compose.yml does.
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Rclone — optional bidirectional sync between the host's /home/workspaces
  # and a configured Google Drive folder. Disable with ENABLE_RCLONE=false.
  # When enabled, the `rclone bisync` loop runs every RCLONE_SYNC_INTERVAL
  # seconds. On first start it auto-initializes the bisync metadata
  # (--resync) so you don't get the "Bisync initial analysis failed" wall
  # on a fresh pair of paths.
  #
  # Authentication is via a single RCLONE_CONFIG_B64 var: the base64 of a
  # full rclone.conf file (same format rclone uses on a local install).
  # This accepts whatever you already have — old token-based configs,
  # multi-account, non-Drive remotes, anything rclone understands.
  #
  # Confined to /home/workspaces only — does NOT touch /app/uploads or any
  # other Docker volume. Workspace dir is mounted read-write so writes from
  # inside the container land on the host.
  # ---------------------------------------------------------------------------
  rclone:
    image: rclone/rclone:latest
    restart: always
    init: true
    env_file:
      - .env
    environment:
      - RCLONE_CONFIG_B64=${RCLONE_CONFIG_B64:-}
      - RCLONE_REMOTE=${RCLONE_REMOTE:-gdrive}
      # Optional: scope sync to a specific Drive folder ID. Empty = use the
      # root_folder_id from the decoded conf (typically Drive root). Set
      # this to force a subfolder without regenerating OAuth tokens.
      - RCLONE_DRIVE_FOLDER_ID=${RCLONE_DRIVE_FOLDER_ID:-}
      - RCLONE_SYNC_INTERVAL=${RCLONE_SYNC_INTERVAL:-300}
      - RCLONE_CONFLICT_POLICY=${RCLONE_CONFLICT_POLICY:-newest}
      - WORKSPACES_HOST_PATH=${WORKSPACES_HOST_PATH:-/home/workspaces}
    volumes:
      # Source: the same path the api + mcp-code-runner see. Mounting it
      # read-write here so rclone can mirror local edits back up.
      - ${WORKSPACES_HOST_PATH:-/home/workspaces}:/data/source:rw
      # Bisync metadata + rclone config cache. Named volume survives restarts.
      - rclone_cache:/cache
      # Entrypoint script (decodes RCLONE_CONFIG_B64, then runs bisync).
      # Bind-mounted (not COPY) so edits to scripts/rclone-entrypoint.sh
      # take effect on `docker compose restart rclone` with no image rebuild.
      - ./scripts/rclone-entrypoint.sh:/scripts/rclone-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/scripts/rclone-entrypoint.sh"]
    # No healthcheck: rclone is a job-in-loop (PID 1 = sh running
    # `while true; do bisync; sleep; done`), not a server. The official
    # rclone/rclone image has no healthcheck.mjs and no daemon to probe.
    # Status is read from `Up` + the entrypoint's logs only.

volumes:
  mongodb_data:
  meili_data:
  librechat_uploads:
  librechat_images:
  faster_whisper_cache:
  browser_profile:
  search_uv_cache:
  fb_marketing_mcp_pgdata:
  omniroute_data:
  omniroute_redis_data:
  rclone_cache:
